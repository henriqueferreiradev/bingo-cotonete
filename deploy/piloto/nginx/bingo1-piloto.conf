# Nginx em contêiner (bingo1-piloto-nginx) na rede bingo1-piloto, separado do Nginx do host
# e da instalação atual. O upstream ativo vem do arquivo gerado pelo executor, montado em
# /etc/nginx/kordan-upstreams/ (upstream_file do alvo), e é trocado com nginx -t + reload.
#
# [VPS] Troque bingo-piloto.kordan.tech pelo domínio do piloto e ajuste os certificados.
include /etc/nginx/kordan-upstreams/bingo1-piloto.conf;

# Enquanto nada foi publicado. O executor reconhece este JSON.
server {
    listen 127.0.0.1:8081;
    default_type application/json;
    location / {
        return 503 '{"kordan_placeholder": true, "detail": "Nenhuma versão publicada"}';
    }
}

# Rota interna do executor (public_url = http://bingo1-piloto-nginx): HTTP só na rede Docker,
# sem redirecionar. Fixa o Host público para o Django aceitar com o ALLOWED_HOSTS do piloto.
server {
    listen 80 default_server;
    server_name bingo1-piloto-nginx;

    location / {
        proxy_pass http://kordan_bingo1_piloto;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host bingo-piloto.kordan.tech;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    server_name bingo-piloto.kordan.tech;
    return 301 https://$host$request_uri;
}

# Rota pública. [VPS] Se o TLS terminar antes deste contêiner (Cloudflare Tunnel ou Nginx do
# host), troque este bloco por um "listen 80" com server_name do domínio e
# X-Forwarded-Proto https, alcançável só pelo terminador TLS.
server {
    listen 443 ssl;
    server_name bingo-piloto.kordan.tech;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    client_max_body_size 10M;

    location / {
        proxy_pass http://kordan_bingo1_piloto;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
